apiVersion: v1
kind: Namespace
metadata:
  name: campus-iot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: campus-iot
data:
  DATA_INGESTION_SERVICE: "http://data-ingestion:8000"
  MODEL_SERVICE: "http://model-service:8001"
  USER_SERVICE: "http://user-service:8002"
  GATEWAY_PORT: "8003"
  CACHE_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion
  namespace: campus-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-ingestion
  template:
    metadata:
      labels:
        app: data-ingestion
    spec:
      containers:
        - name: data-ingestion
          image: data-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ERROR_ONLY_LOGGING
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /app/01_Data_Ingestion_Service
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion
  namespace: campus-iot
spec:
  selector:
    app: data-ingestion
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: campus-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
    spec:
      containers:
        - name: model-service
          image: model-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: ERROR_ONLY_LOGGING
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: model-data
              mountPath: /app/02_Model_Service
      volumes:
        - name: model-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: campus-iot
spec:
  selector:
    app: model-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: campus-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: ERROR_ONLY_LOGGING
              value: "false"
            - name: MODEL_API_URL
              value: "http://model-service:8001"
            - name: DATA_INGESTION_SERVICE_URL
              value: "http://data-ingestion:8000"
            - name: WEBSOCKET_ENABLED
              value: "false"
            - name: MESSAGE_QUEUE_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: user-data
              mountPath: /app/04_User_Service
      volumes:
        - name: user-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: campus-iot
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: campus-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: gateway-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: campus-iot
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-metrics
  namespace: campus-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-metrics
  template:
    metadata:
      labels:
        app: live-metrics
    spec:
      containers:
        - name: live-metrics
          image: live-metrics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
          env:
            - name: LIVE_METRICS_PORT
              value: "8010"
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: live-metrics
  namespace: campus-iot
spec:
  selector:
    app: live-metrics
  ports:
    - name: http
      port: 8010
      targetPort: 8010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: campus-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: campus-iot
spec:
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 5173
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-iot-ingress
  namespace: campus-iot
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: campus.local
      http:
        paths:
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80

